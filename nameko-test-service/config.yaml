
serializer: xjson

SERIALIZERS:
  json:
    encoder: json_serializer.encode
    decoder: json_serializer.decode
    content_type: application/json
  xjson:
    encoder: xjson.encode
    decoder: xjson.decode
    content_type: application/xjson

ACCEPT:
  - json
  - xjson

AMQP_URI: amqp://${RABBIT_USER:guest}:${RABBIT_PASS:guest}@${RABBIT_SERVER:localhost}:${RABBIT_PORT:5672}/${RABBIT_VHOST:}
